<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>神社マップ 日本版プレビュー（仮）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* ══════════════════════════════════════════════════════════════
     神社マップ_preview/index.html
     位置づけ：design-lab/opening-intro.html のスナップショット。
     本番index.html（幹）ともマスタープラン本セットアップ（枝1／
     神社マップ_intl）とも別物の、一時的な確認用プレビュー。
     ══════════════════════════════════════════════════════════════ */
  :root {
    --bg-body: #1a1209;
    --bg-header-1: #2c1810;
    --gold: #f5d08a;
    --gold-2: #e0b060;
    --gold-glow-rgb: 245,180,60;
    --gold-muted: #907040;
    --border-4: #6a5030;
    --tan-text: #ddd0a0;
    --tan-text-2: #b08858;
    /* ── 以下、本番index.htmlのポップアップ配色をそのまま流用（⑤本体の神宮・大社地図用） ── */
    --bg-popup-1: #1e0e06;
    --bg-popup-2: #0f0a1a;
    --border-header: #6b3a1f;
    --text-body: #f0e6c8;
    --color-link: #7eb8ff;
    --color-link-hover: #aad4ff;
    --color-wiki: #b8b8c8;
    --color-wiki-hover: #d8d8e8;
    --color-popup-reason: #708870;
    --color-popup-deity: #906848;
    --tag-jingu: #d4860a;    --tag-jingu-rgb: 212,134,10;   --tag-jingu-light: #f5c842;
    --tag-taisha: #7c3aed;   --tag-taisha-rgb: 124,58,237;  --tag-taisha-light: #c4a8ff;
    --tag-ichi: #e83020;     --tag-ichi-rgb: 232,48,32;     --tag-ichi-light: #ff9a8a;
    --tag-ni: #1a50d8;       --tag-ni-rgb: 26,80,216;       --tag-ni-light: #88b4ff;
    --tag-meisha: #059669;   --tag-meisha-rgb: 5,150,105;   --tag-meisha-light: #6ee7b7;
    --tag-meisha2: #0284c7;  --tag-meisha2-rgb: 2,132,199;  --tag-meisha2-light: #7dd3fc;
    --tag-meisha3: #b45309;  --tag-meisha3-rgb: 180,83,9;   --tag-meisha3-light: #fcd34d;
    --tag-hachiman: #be185d; --tag-hachiman-rgb: 190,24,93; --tag-hachiman-light: #f9a8d4;
    --tag-inari: #0d9488;    --tag-inari-rgb: 13,148,136;   --tag-inari-light: #5eead4;
  }
  * { box-sizing: border-box; }
  html { scroll-snap-type: y proximity; }
  body {
    margin: 0; background: var(--bg-body); color: var(--tan-text);
    font-family: -apple-system, 'Hiragino Kaku Gothic ProN', sans-serif;
  }

  /* ── ①②③（自動送り版と同一）：ロード画面→鳥居の静止画→全画面動画 ── */
  #intro {
    position: fixed; inset: 0; z-index: 5000;
    background: var(--bg-body);
    cursor: pointer;
    transition: opacity 0.6s ease;
  }
  #intro.intro-hide { opacity: 0; pointer-events: none; }

  .intro-loader {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    transition: opacity 0.5s ease;
  }
  .intro-loader.intro-loader-hide { opacity: 0; }

  .intro-ring { position: relative; width: 88px; height: 88px; display: grid; place-items: center; }
  .intro-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .intro-ring circle { fill: none; stroke-width: 2; }
  .intro-ring-track { stroke: var(--border-4); opacity: 0.4; }
  .intro-ring-progress {
    stroke: var(--gold); stroke-dasharray: 251; stroke-dashoffset: 251;
    filter: drop-shadow(0 0 4px rgba(var(--gold-glow-rgb),0.7));
    animation: introRingFill 1.4s cubic-bezier(0.4,0,0.2,1) forwards;
  }
  .intro-torii { font-size: 34px; filter: drop-shadow(0 0 8px rgba(220,80,30,0.75)); }
  @keyframes introRingFill { to { stroke-dashoffset: 0; } }

  .intro-percent {
    font-variant-numeric: tabular-nums;
    color: var(--border-4); font-size: 11px; letter-spacing: 0.1em;
  }

  .intro-title {
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    color: var(--gold); font-size: 18px; letter-spacing: 0.08em;
    opacity: 0; animation: introFadeIn 0.6s ease 0.3s forwards;
  }
  @keyframes introFadeIn { to { opacity: 1; } }

  .intro-hero { position: absolute; inset: 0; z-index: 1; opacity: 1; transition: opacity 1s ease; }
  .intro-hero.intro-hero-fade { opacity: 0; }
  .intro-hero-media {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    background: radial-gradient(ellipse at center, var(--bg-header-1), var(--bg-body) 70%);
  }
  .intro-shrine-name {
    position: absolute; left: 50%; bottom: calc(14% + 38px); transform: translateX(-50%);
    z-index: 1; text-align: center; white-space: nowrap;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    color: var(--gold); font-size: 24px; letter-spacing: 0.14em;
    text-shadow: 0 2px 14px rgba(0,0,0,0.7), 0 0 24px rgba(var(--gold-glow-rgb),0.35);
  }
  .intro-shrine-name::after {
    content: ''; display: block; width: 26px; height: 1px; margin: 10px auto 0;
    background: var(--gold); opacity: 0; transition: opacity 0.6s ease 1s;
  }
  .intro-shrine-name.intro-shrine-name-show::after { opacity: 0.55; }

  .intro-video { position: absolute; inset: 0; z-index: 1; opacity: 0; transition: opacity 1s ease; }
  .intro-video.intro-video-show { opacity: 1; }
  .intro-video-media {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    background: var(--bg-header-1);
  }
  .intro-video-label {
    position: absolute; left: 14px; bottom: 14px; z-index: 1;
    font-size: 10px; letter-spacing: 0.06em; color: rgba(221,208,160,0.55);
    background: rgba(0,0,0,0.35); padding: 4px 8px; border-radius: 3px;
  }

  .intro-overlay {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.35));
  }
  .intro-tagline {
    position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%); white-space: nowrap;
    z-index: 1;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    color: var(--tan-text); font-size: 15px; letter-spacing: 0.06em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  /* ③動画だけのキャッチコピー（本人指定・2026-09-06：コラージュ見出し用の一文をここへ移動） */
  .intro-video-caption {
    position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%);
    z-index: 1; text-align: center; max-width: 82vw;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    color: var(--gold); font-size: clamp(20px, 3.2vw, 32px); letter-spacing: 0.05em;
    line-height: 1.6;
    text-shadow: 0 2px 14px rgba(0,0,0,0.7);
  }
  /* ②③共通：文字を1文字ずつ順番にゆっくり表示する演出（本人指定・2026-09-08）。
     「絶対に見せる」演出ではなく、自然に読み進めるうちに次（④3枚の写真）へ
     気持ちが向くようにするための間（ま）。JSがテキストを1文字ずつ<span>に
     分割し、transition-delayをずらして設定する（wrapCharsReveal関数）。
     ②の鳥居写真の神社名（.intro-shrine-name）にも同じ演出を適用。 */
  .intro-tagline .char, .intro-video-caption .char, .intro-shrine-name .char {
    display: inline-block; opacity: 0; transform: translateY(8px);
    transition: opacity 1.1s ease, transform 1.1s ease;
  }
  .intro-tagline.intro-tagline-show .char,
  .intro-video-caption.intro-video-caption-show .char,
  .intro-shrine-name.intro-shrine-name-show .char {
    opacity: 1; transform: translateY(0);
  }

  .intro-gate {
    position: absolute; top: 0; bottom: 0; width: 50%; z-index: 2;
    background: var(--bg-body);
    transition: transform 1.65s cubic-bezier(0.65,0,0.35,1);
  }
  .intro-gate-left { left: 0; }
  .intro-gate-right { right: 0; }
  .intro-gate::before {
    content: ''; position: absolute; top: 20%; width: 30px; height: 4px;
    background: var(--gold); box-shadow: 0 0 8px rgba(var(--gold-glow-rgb),0.6);
  }
  .intro-gate-left::before { right: -2px; }
  .intro-gate-right::before { left: -2px; }
  .intro-gate-left.intro-gate-open { transform: translateX(-100%); }
  .intro-gate-right.intro-gate-open { transform: translateX(100%); }

  @media (prefers-reduced-motion: reduce) {
    #intro { display: none !important; }
  }

  /* ── ④3枚の全画面写真をscroll-snapで縦に並べる（本人採用決定・2026-09-07）。
     scale(1.18)→scale(1)のズームアウトを、IntersectionObserverで
     画面に入った瞬間にトリガーする ── */
  .scroll-slide {
    position: relative; height: 100vh; overflow: hidden;
    scroll-snap-align: start;
  }
  .scroll-slide img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: saturate(0.92) contrast(1.05);
    transform: scale(1.18);
    transition: transform 5.5s cubic-bezier(0.16,0.6,0.3,1);
  }
  .scroll-slide.revealed img { transform: scale(1); }

  /* ④3枚の写真をまたいで「動かず・変わらない」1本の文字情報（本人指定・2026-09-06）。
     position:fixedでビューポートに固定し、スクロールしても位置も内容も一切変わらない。
     写真セクションを抜けて本体（mock-app）に入ったら消える ── */
  .fixed-caption {
    position: fixed; left: 50%; bottom: 17%; transform: translateX(-50%);
    z-index: 10; text-align: center; max-width: 80vw; pointer-events: none;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    color: var(--gold); font-size: clamp(24px, 4vw, 38px); letter-spacing: 0.06em;
    text-shadow: 0 4px 24px rgba(0,0,0,0.75);
    opacity: 0; transition: opacity 1s ease;
  }
  .fixed-caption.fixed-caption-show { opacity: 1; }
  .scroll-slide-hint {
    position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 12px 26px; border-radius: 32px;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(var(--gold-glow-rgb),0.45);
    font-size: 14px; font-weight: 700; letter-spacing: 0.35em; color: var(--gold);
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    animation: scrollHintPulse 1.6s ease-in-out infinite;
  }
  .scroll-slide-hint-arrow {
    font-size: 32px; line-height: 1; animation: scrollHintBounce 1.4s ease-in-out infinite;
  }
  @keyframes scrollHintBounce {
    0%, 100% { transform: translateY(0); opacity: 0.65; }
    50% { transform: translateY(14px); opacity: 1; }
  }
  @keyframes scrollHintPulse {
    0%, 100% { box-shadow: 0 0 14px rgba(var(--gold-glow-rgb),0.2); }
    50% { box-shadow: 0 0 34px rgba(var(--gold-glow-rgb),0.5); }
  }
  @media (prefers-reduced-motion: reduce) {
    .scroll-slide-hint { animation: none; }
    .scroll-slide-hint-arrow { animation: none; }
  }

  /* ── ここから下は「本体（地図・メニュー画面）」。地図本体は本番index.htmlの実装を流用 ── */
  /* サイドバー実装時に発覚：min-height:100vhのままだと配下の#map-areaがflex:1でも
     「残りの縦幅を使う」動作にならず、サイドバーのリスト項目（152件の実コンテンツ）
     がそのまま縦に伸び、地図・サイドバー全体が4700px超まで引き伸ばされてしまう。
     heightを確定値にして初めてflex:1とoverflow-y:autoが機能する */
  .mock-app { height: 100vh; display: flex; flex-direction: column; scroll-snap-align: start; }
  .mock-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border-4);
    display: flex; align-items: center; gap: 10px;
  }
  .mock-header .torii-icon { font-size: 24px; filter: drop-shadow(0 0 8px rgba(220,80,30,0.75)); }
  .mock-header h1 {
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    font-size: 18px; color: var(--gold); margin: 0; letter-spacing: 0.04em;
  }
  /* 言語切替（本人指摘・2026-09-08：漢字1文字のタグは海外版では意味をなさない。
     タグ・神社名の表現を英語に切り替えて見比べられるようにする試作） */
  .lang-toggle { display: flex; gap: 4px; margin-left: auto; flex-shrink: 0; }
  .lang-btn {
    font-size: 11px; letter-spacing: 0.05em; padding: 5px 10px; border-radius: 14px;
    border: 1px solid var(--border-4); background: transparent; color: var(--tan-text);
    cursor: pointer; font-family: inherit;
  }
  .lang-btn.active { background: rgba(var(--gold-glow-rgb),0.22); border-color: var(--gold); color: var(--gold); }
  /* 個別神社ページへの導線とタグフィルターを1段にまとめる（本人指定・2026-09-10：
     タグは右端に並べる。個別神社紹介は横並びのアイコン列ではなく、縦の収納型
     ――普段は閉じていてクリックで縦リストが開くドロップダウン――にする。
     「理想の形はあるが伝えにくいので、一般的なものを一旦採用」とのことなので、
     最も一般的なドロップダウンメニューの型を採用した */
  .mock-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 20px; border-bottom: 1px solid var(--border-4);
    position: relative;
  }
  .shrine-dropdown { position: relative; flex-shrink: 0; }
  .shrine-dropdown-toggle {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border-4);
    background: rgba(0,0,0,0.22); color: var(--tan-text);
    font-family: inherit; font-size: 13px; letter-spacing: 0.03em; cursor: pointer;
    transition: all 0.2s;
  }
  .shrine-dropdown-toggle:hover { border-color: var(--gold-muted); color: var(--gold-2); }
  .shrine-dropdown.open .shrine-dropdown-toggle { border-color: var(--gold); color: var(--gold); background: rgba(var(--gold-glow-rgb),0.14); }
  .shrine-dropdown-caret { font-size: 9px; opacity: 0.7; transition: transform 0.2s; }
  .shrine-dropdown.open .shrine-dropdown-caret { transform: rotate(180deg); }
  .shrine-dropdown-panel {
    /* z-indexはLeafletの内部ペイン（ズームコントロール1000・ポップアップペイン700等）より
       確実に上に来る値にする。#map-area・#shrine-mapのどちらもposition:relativeのみで
       z-indexを持たず独自の重なりコンテキストを作らないため、Leafletの内部要素の
       z-indexがそのままこのドロップダウンパネルと直接競合し、低い値だと地図の下に
       埋もれてしまう（本人指摘・2026-09-10で発覚） */
    position: absolute; top: calc(100% + 8px); left: 0; z-index: 2000;
    min-width: 200px; padding: 6px;
    background: linear-gradient(180deg, var(--bg-popup-1) 0%, var(--bg-popup-2) 100%);
    border: 1px solid var(--border-header); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    display: none;
  }
  .shrine-dropdown.open .shrine-dropdown-panel { display: block; }
  .shrine-dropdown-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; text-decoration: none; }
  .shrine-dropdown-item:hover { background: rgba(var(--gold-glow-rgb),0.10); }
  .shrine-dropdown-badge {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; font-size: 13px; font-weight: bold; color: #fff;
  }
  .shrine-dropdown-name { font-size: 13px; color: var(--tan-text); white-space: nowrap; }

  /* タグフィルター（本人指定・2026-09-10：海外版は神宮・大社・一宮・二宮の4タグに厳選。
     見た目・構成は本番index.htmlの.controls-tagsに合わせるが、参拝記録・令制国絞り込み・
     達成状況モーダルはこの地図には持ち込まない） */
  .mock-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .filter-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 20px; border: 1.5px solid;
    cursor: pointer; font-family: inherit; font-size: 13px; letter-spacing: 0.05em;
    transition: all 0.25s; opacity: 0.42; background: transparent;
  }
  .filter-btn.active { opacity: 1; }
  .filter-btn.jingu  { border-color: var(--tag-jingu);  color: var(--tag-jingu-light);  background: rgba(var(--tag-jingu-rgb),0.12); }
  .filter-btn.jingu.active  { background: rgba(var(--tag-jingu-rgb),0.38);  box-shadow: 0 0 9px rgba(var(--tag-jingu-rgb),0.4); }
  .filter-btn.taisha { border-color: var(--tag-taisha); color: var(--tag-taisha-light); background: rgba(var(--tag-taisha-rgb),0.12); }
  .filter-btn.taisha.active { background: rgba(var(--tag-taisha-rgb),0.32); box-shadow: 0 0 9px rgba(var(--tag-taisha-rgb),0.4); }
  .filter-btn.ichi   { border-color: var(--tag-ichi);   color: var(--tag-ichi-light);   background: rgba(var(--tag-ichi-rgb),0.12); }
  .filter-btn.ichi.active   { background: rgba(var(--tag-ichi-rgb),0.36);   box-shadow: 0 0 9px rgba(var(--tag-ichi-rgb),0.4); }
  .filter-btn.ni     { border-color: var(--tag-ni);     color: var(--tag-ni-light);     background: rgba(var(--tag-ni-rgb),0.12); }
  .filter-btn.ni.active     { background: rgba(var(--tag-ni-rgb),0.32);     box-shadow: 0 0 9px rgba(var(--tag-ni-rgb),0.4); }
  .filter-btn .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  /* 名社１のダミータグ（本人指定・2026-09-10：外国人旅行者向けの選定はまだ済んでいない
     ため、今はタグの置き場所だけ確保する。破線＋低opacity＋クリック不可で
     「準備中」であることを視覚的に示し、フィルターのクリック委譲（.filter-btn対象）
     からも意図的に外している */
  .filter-btn-dummy {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 11px; border-radius: 20px; border: 1.5px dashed var(--tag-meisha);
    font-family: inherit; font-size: 13px; letter-spacing: 0.05em;
    color: var(--tag-meisha-light); opacity: 0.4; cursor: not-allowed; background: transparent;
  }
  .ctrl-divider { width: 1px; height: 22px; background: var(--border-4); margin: 0 2px; flex-shrink: 0; }
  .mock-stats { font-size: 12px; color: var(--tan-text-2); border-left: 1px solid var(--border-4); padding-left: 10px; white-space: nowrap; }

  #map-area { flex: 1; display: flex; position: relative; overflow: hidden; min-height: 320px; }
  #shrine-map { flex: 1; min-width: 0; width: 100%; }
  #sidebar {
    width: 220px; flex-shrink: 0;
    background: linear-gradient(180deg, var(--bg-popup-1) 0%, var(--bg-popup-2) 100%);
    border-left: 1px solid var(--border-header);
    display: flex; flex-direction: column;
  }
  .sidebar-top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; border-bottom: 1px solid var(--border-header);
    background: rgba(44,24,16,0.6); flex-shrink: 0;
  }
  .sidebar-title { font-size: 12px; letter-spacing: 0.08em; color: var(--tan-text); }
  .sidebar-count { font-size: 11px; color: var(--gold-muted); }
  #sidebar-list {
    flex: 1; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--border-header) transparent;
  }
  .sidebar-section-title {
    position: sticky; top: 0; z-index: 10;
    padding: 6px 12px 6px 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-section-count { font-size: 10.5px; font-weight: 400; opacity: 0.65; }
  .shrine-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    cursor: pointer; border-bottom: 1px solid rgba(58,30,8,0.4);
    transition: background 0.12s;
  }
  .shrine-item:hover { background: rgba(var(--gold-glow-rgb),0.08); }
  .shrine-item-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .shrine-item-name {
    font-size: 11.5px; color: var(--tan-text); flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .shrine-item-pref { font-size: 10px; color: var(--gold-muted); flex-shrink: 0; }

     恒久的に上書きしたまま残ると、以後の地図移動でマーカーが取り残される */
  @keyframes markerPopIn {
    from { opacity: 0; transform: scale(0.4); }

  .marker-pop-in { animation: markerPopIn 0.25s cubic-bezier(0.34,1.56,0.64,1) both; transform-origin: 50% 95%; }
  .marker-pop-out { animation: markerPopIn 0.12s ease-in reverse both; transform-origin: 50% 95%; }

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  // ②③のキャッチコピー・神社名を1文字ずつ<span>に分割し、transition-delayを
  // ずらして「順番にゆっくり表示される」演出にする（本人指定・2026-09-08）。
  // fetchのコールバックは reduced/alreadyShown の早期returnと無関係に実行される
  // ため、CHAR_STEPはここで最初に定義しておく。
  function wrapCharsReveal(el, stepMs) {
    var i = 0;
    el.innerHTML = el.innerHTML.split('<br>').map(function(line){
      return Array.from(line).map(function(ch){
        var span = '<span class="char" style="transition-delay:' + (i * stepMs) + 'ms">' + ch + '</span>';
        i++;
        return span;
      }).join('');
    }).join('<br>');
    return i;
  }
  var CHAR_STEP = 120;   // 1文字あたりの表示間隔(ms)（本人指摘「速すぎる」で60→120に倍増）
  var CHAR_FADE = 1100;  // 1文字のフェード時間(ms)。CSSの.char transitionと合わせる（同じく倍増）
  var READ_BUFFER = 2500; // 全文字が表示され終わってから、読む余裕として追加する時間(ms)

  // ②鳥居の静止画＋神社名（自動送り版と同一の仕組み）
  var heroImg = document.querySelector('.intro-hero-media');
  var shrineNameEl = document.getElementById('intro-shrine-name');
  fetch('assets/torii-manifest.json')
    .then(function(res){ return res.json(); })
    .then(function(list){
      if (!list.length) return;
      var pick = list[Math.floor(Math.random() * list.length)];
      heroImg.src = pick.file;
      shrineNameEl.textContent = pick.name;
      wrapCharsReveal(shrineNameEl, CHAR_STEP); // 神社名も他の文字と同じ1文字ずつ表示に揃える
    })
    .catch(function(){});

  var intro = document.getElementById('intro');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var alreadyShown = sessionStorage.getItem('introShown') === '1';
  if (reduced || alreadyShown) { intro.style.display = 'none'; return; }
  sessionStorage.setItem('introShown', '1');

  var loader = intro.querySelector('.intro-loader');
  var hero = intro.querySelector('.intro-hero');
  var video = intro.querySelector('.intro-video');
  var tagline = intro.querySelector('.intro-tagline');
  var videoCaption = document.getElementById('intro-video-caption');
  var gateLeft = intro.querySelector('.intro-gate-left');
  var gateRight = intro.querySelector('.intro-gate-right');
  var percentEl = document.getElementById('intro-percent');
  var finished = false;

  var taglineCharCount = wrapCharsReveal(tagline, CHAR_STEP);
  var videoCaptionCharCount = wrapCharsReveal(videoCaption, CHAR_STEP);
  var taglineHoldMs = Math.max(5000, (taglineCharCount - 1) * CHAR_STEP + CHAR_FADE + READ_BUFFER);
  var videoHoldMs = Math.max(3000, (videoCaptionCharCount - 1) * CHAR_STEP + CHAR_FADE + READ_BUFFER);

  var RING_MS = 1400;
  var start = performance.now();
  function tickPercent(now) {
    var p = Math.min(100, Math.round((now - start) / RING_MS * 100));
    percentEl.textContent = p;
    if (p < 100 && !finished) requestAnimationFrame(tickPercent);
  }
  requestAnimationFrame(tickPercent);

  var fixedCaption = document.getElementById('fixed-caption');
  function finish() {
    if (finished) return;
    finished = true;
    intro.classList.add('intro-hide');
    setTimeout(function(){ intro.style.display = 'none'; }, 650);
    fixedCaption.classList.add('fixed-caption-show'); // ④スクロール領域に入ったら固定表示を開始
  }
  function openGates() {
    loader.classList.add('intro-loader-hide');
    gateLeft.classList.add('intro-gate-open');
    gateRight.classList.add('intro-gate-open');
    tagline.classList.add('intro-tagline-show');
    document.getElementById('intro-shrine-name').classList.add('intro-shrine-name-show');
  }
  function showVideo() {
    hero.classList.add('intro-hero-fade');
    video.classList.add('intro-video-show');
    tagline.classList.remove('intro-tagline-show');
    videoCaption.classList.add('intro-video-caption-show');
  }
  intro.addEventListener('click', finish);
  setTimeout(openGates, 1500);                    // ①ロード(1.4s)完了→gateが開く
  setTimeout(showVideo, 1500 + taglineHoldMs);     // ②鳥居の静止画＋文字が読み終わるまで見せる→③動画へ
  // ③→④：自動送り版と違い、ここでは動画の後すぐ#introを閉じてスクロール領域へ渡す
  // （タイマーで写真を送るのではなく、本人が実際にスクロールして3枚を見る方式のため）
  setTimeout(finish, 1500 + taglineHoldMs + videoHoldMs); // ③動画＋文字が読み終わるまで見せる→④（スクロール領域）へ
})();

// ④の固定キャプションは、本体（mock-app）に入ったら消す
(function(){
  var fixedCaption = document.getElementById('fixed-caption');
  var mockApp = document.getElementById('mock-app');
  if (!('IntersectionObserver' in window)) return;
  var io2 = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (entry.isIntersecting) fixedCaption.classList.remove('fixed-caption-show');
    });
  }, { threshold: 0.2 });
  io2.observe(mockApp);
})();

// ④スクロール連動のズームアウト：画面に入った写真だけ.revealedを付与
// （本人指定・2026-09-10：候補写真が増えたため、固定3枚ではなくマニフェストから
// 毎回ランダムに3枚選んで表示する。スライドをJSで動的に生成するため、
// このIntersectionObserver設定は挿入後に呼べるよう関数化してある）
function initScrollSlideReveal() {
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var items = document.querySelectorAll('.reveal-slide');
  if (reduced || !('IntersectionObserver' in window)) {
    items.forEach(function(el){ el.classList.add('revealed'); });
    return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (entry.isIntersecting) {
        entry.target.classList.add('revealed');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.4 });
  items.forEach(function(el){ io.observe(el); });
}

(function(){
  var FALLBACK = [
    { file: 'assets/katori-backlit.jpg', alt: '香取神宮' },
    { file: 'assets/kashima-hall.jpg', alt: '鹿島神宮' },
    { file: 'assets/samukawa-sakura.jpg', alt: '寒川神社' },
  ];
  var SLIDE_COUNT = 3;

  function pickRandom(list, n) {
    var pool = list.slice();
    var picked = [];
    while (picked.length < n && pool.length) {
      var idx = Math.floor(Math.random() * pool.length);
      picked.push(pool.splice(idx, 1)[0]);
    }
    return picked;
  }

  function renderSlides(list) {
    var container = document.getElementById('scroll-slides');
    if (!container) return;
    var picked = pickRandom(list, SLIDE_COUNT);
    container.innerHTML = picked.map(function(item, i){
      var idAttr = i === picked.length - 1 ? ' id="last-scroll-slide"' : '';
      return '<section class="scroll-slide reveal-slide"' + idAttr + '>' +
        '<img src="' + item.file + '" alt="' + (item.alt || '') + '">' +
        '<div class="scroll-slide-hint"><span class="scroll-slide-hint-arrow">⌄</span>SCROLL</div>' +
        '</section>';
    }).join('');
    initScrollSlideReveal();
  }

  fetch('assets/zoomout-manifest.json')
    .then(function(res){ return res.json(); })
    .then(function(list){ renderSlides(list && list.length ? list : FALLBACK); })
    .catch(function(){ renderSlides(FALLBACK); });
})();

// ⑤本体：神宮・大社タグの神社のみ（48社）を表示する簡易地図
// マーカー・アイコン・ポップアップは本番index.htmlの実装をそのまま移植（フィルタ・サイドバー・参拝記録は含まない）
// 言語切替（本人指摘・2026-09-08）：「漢字1文字のタグ・神社名バッジは海外版では
// 意味をなさない」との指摘を受け、タグ・神社名・UI文言（チップ・見出し）を
// 英語に切り替えて見比べられる試作を追加。個別社データ（由緒・祭神など、
// shrines-jingu-taisha.jsonの中身）は翻訳コストが別次元のため対象外（日本語のまま）。
(function(){
  var currentLang = 'ja';
  var HEADER_TITLE = { ja: '社巡り道標（海外版・仮）', en: 'Shrine Guide (Overseas Ver. — Draft)' };
  var CHROME_TEXT = {
    ja: {
      province: '旧国：', deity: '祭神：', map: '地図', official: '公式', wiki: 'Wiki',
      listTitle: '神社リスト',
      shownFmt: function(n){ return '表示中 ' + n + ' 社'; },
      countFmt: function(n){ return n + '社'; },
    },
    en: {
      province: 'Province: ', deity: 'Deity: ', map: 'Map', official: 'Official', wiki: 'Wiki',
      listTitle: 'Shrine List',
      shownFmt: function(n){ return 'Showing ' + n + ' shrine' + (n === 1 ? '' : 's'); },
      countFmt: function(n){ return n + ' shrine' + (n === 1 ? '' : 's'); },
    },
  };
  var PRIORITY = { jingu:10, taisha:9, ichi:8, ni:7, meisha:6, meisha2:5, hachiman:4, inari:3, meisha3:2 };
  // 海外版で実際に絞り込み対象にするタグ（本人指定・2026-09-10）。名社１は
  // 外国人旅行者向けに選定し直す方針のため、選定が済むまではここに含めない
  var TAG_ORDER = ['jingu', 'taisha', 'ichi', 'ni'];
  var TAG_CONFIG = {
    jingu:   { label:{ja:'神宮',en:'Jingu'},        char:{ja:'神',en:'J'},  color:'#c47a08', border:'#f5c842', bg:'rgba(212,134,10,0.18)' },
    taisha:  { label:{ja:'大社',en:'Taisha'},       char:{ja:'大',en:'T'},  color:'#6d28d9', border:'#c4a8ff', bg:'rgba(124,58,237,0.18)' },
    ichi:    { label:{ja:'一宮',en:'Ichinomiya (1st)'}, char:{ja:'一',en:'1'}, color:'#c41810', border:'#ff9a8a', bg:'rgba(232,48,32,0.18)' },
    ni:      { label:{ja:'二宮',en:'Ninomiya (2nd)'},   char:{ja:'二',en:'2'}, color:'#1540c0', border:'#88b4ff', bg:'rgba(26,80,216,0.18)' },
    meisha:  { label:{ja:'名社１',en:'Notable α'}, char:{ja:'名',en:'α'}, color:'#047857', border:'#6ee7b7' },
    meisha2: { label:{ja:'名社２',en:'Notable β'}, char:{ja:'社',en:'β'}, color:'#0369a1', border:'#7dd3fc' },
    meisha3: { label:{ja:'名社３',en:'Notable γ'}, char:{ja:'奉',en:'γ'}, color:'#92400e', border:'#fcd34d' },
    hachiman:{ label:{ja:'八幡',en:'Hachiman'},     char:{ja:'八',en:'H'},  color:'#be185d', border:'#f9a8d4' },
    inari:   { label:{ja:'稲荷',en:'Inari'},        char:{ja:'稲',en:'In'}, color:'#0d9488', border:'#5eead4' },
  };
  function topTag(tags) {
    return tags.reduce(function(b,t){ return PRIORITY[t] > PRIORITY[b] ? t : b; }, tags[0]);
  }
  var iconCache = {};
  function getIcon(tag) {
    var key = currentLang + '_' + tag;
    if (iconCache[key]) return iconCache[key];
    var c = TAG_CONFIG[tag];
    var ch = c.char[currentLang];
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="34" height="42" viewBox="0 0 34 42">' +
      '<path d="M17 2C9 2 2 9 2 17c0 10 15 23 15 23S32 27 32 17C32 9 25 2 17 2z" fill="' + c.color + '" fill-opacity="0.9" stroke="' + c.border + '" stroke-width="1.5"/>' +
      '<circle cx="17" cy="17" r="9" fill="rgba(255,255,255,0.13)"/>' +
      '<text x="17" y="22" text-anchor="middle" font-family="\'Hiragino Mincho ProN\',\'Yu Mincho\',serif" font-size="' + (ch.length > 1 ? 10 : 12) + '" font-weight="bold" fill="white">' + ch + '</text>' +
      '</svg>';
    iconCache[key] = L.divIcon({ html: svg, className: '', iconSize: [34,42], iconAnchor: [17,40], popupAnchor: [0,-42] });
    return iconCache[key];
  }
  function buildPopupContent(s) {
    var t = CHROME_TEXT[currentLang];
    var badges = s.tags.slice().sort(function(a,b){ return PRIORITY[b]-PRIORITY[a]; })
      .map(function(tag){ return '<span class="popup-badge ' + tag + '">' + TAG_CONFIG[tag].label[currentLang] + '</span>'; }).join('');
    var reasonHtml = s.reason ? '<div class="popup-reason">' + s.reason + '</div>' : '';
    var gmapsUrl = 'https://www.google.com/maps/search/' + encodeURIComponent(s.name);
    var officialUrl = 'https://www.google.com/search?q=' + encodeURIComponent(s.name + ' 公式');
    var wikiUrl = 'https://ja.wikipedia.org/w/index.php?search=' + encodeURIComponent(s.name) + '&title=特別:検索&go=Go';
    return '<div class="popup-content">' +
      '<div class="popup-badges">' + badges + '</div>' +
      '<div class="popup-name">' + s.name + '</div>' +
      '<div class="popup-pref">' + s.pref + '</div>' +
      '<div class="popup-province">' + t.province + s.province + '</div>' +
      reasonHtml +
      '<div class="popup-deity">' + t.deity + s.deity + '</div>' +
      '<div class="popup-links">' +
        '<a href="' + gmapsUrl + '" target="_blank" rel="noopener" class="popup-link gmaps"><span class="popup-link-icon">📍</span>' + t.map + '</a>' +
        '<a href="' + officialUrl + '" target="_blank" rel="noopener" class="popup-link official"><span class="popup-link-icon">🌐</span>' + t.official + '</a>' +
        '<a href="' + wikiUrl + '" target="_blank" rel="noopener" class="popup-link wiki"><span class="popup-link-icon">📖</span>' + t.wiki + '</a>' +
      '</div></div>';
  }

  // 個別神社ページへの導線（本人指定・2026-09-10：横並びのアイコン列ではなく、
  // 普段は閉じていてクリックで開く縦の収納型ドロップダウンに変更。
  // ページが増えたらこの配列に追記するだけでよい）
  var DROPDOWN_LABEL = { ja: '個別紹介', en: 'Shrine Pages' };
  var SHRINE_PAGES = [
    { name:{ja:'伊勢神宮',en:'Ise Jingu'},   short:{ja:'伊',en:'I'}, tag:'jingu', file:'shrine-pages/伊勢神宮.html' },
    { name:{ja:'明治神宮',en:'Meiji Jingu'}, short:{ja:'明',en:'M'}, tag:'jingu', file:'shrine-pages/明治神宮.html' },
  ];
  function renderShrineDropdown(){
    var label = document.getElementById('shrine-dropdown-label');
    if (label) label.textContent = '⛩ ' + DROPDOWN_LABEL[currentLang];
    var panel = document.getElementById('shrine-dropdown-panel');
    if (!panel) return;
    panel.innerHTML = SHRINE_PAGES.map(function(s){
      var c = TAG_CONFIG[s.tag];
      return '<a class="shrine-dropdown-item" href="' + s.file + '">' +
        '<span class="shrine-dropdown-badge" style="background:' + c.color + ';border:1.5px solid ' + c.border + ';">' + s.short[currentLang] + '</span>' +
        '<span class="shrine-dropdown-name">' + s.name[currentLang] + '</span>' +
        '</a>';
    }).join('');
  }
  renderShrineDropdown();
  var shrineDropdown = document.getElementById('shrine-dropdown');
  document.getElementById('shrine-dropdown-toggle').addEventListener('click', function(e){
    e.stopPropagation();
    shrineDropdown.classList.toggle('open');
  });
  document.addEventListener('click', function(e){
    if (shrineDropdown.classList.contains('open') && !shrineDropdown.contains(e.target)) {
      shrineDropdown.classList.remove('open');
    }
  });

  // タグフィルター（本人指定・2026-09-10：神宮・大社・一宮・二宮の4タグのみ。
  // 本番と違い候補タグがこの4つで全部なので「その他のタグ」展開パネルは作らない）
  var activeFilters = new Set(TAG_ORDER);
  function passesFilter(shrine) {
    return shrine.tags.some(function(t){ return activeFilters.has(t); });
  }
  // サイドバーでの振り分け先：有効フィルタの中で最優先のタグ
  function displayTag(shrine) {
    var tags = shrine.tags.filter(function(t){ return activeFilters.has(t); });
    if (!tags.length) return null;
    return tags.reduce(function(b,t){ return PRIORITY[t] > PRIORITY[b] ? t : b; }, tags[0]);
  }
  function renderFilterButtons() {
    var container = document.getElementById('mock-controls');
    if (!container) return;
    var buttonsHtml = TAG_ORDER.map(function(tag){
      var c = TAG_CONFIG[tag];
      var active = activeFilters.has(tag) ? ' active' : '';
      return '<button type="button" class="filter-btn ' + tag + active + '" data-tag="' + tag + '">' +
        '<span class="dot" style="background:' + c.border + ';box-shadow:0 0 5px ' + c.border + '"></span>' +
        c.label[currentLang] + '</button>';
    }).join('');
    // 名社１のダミータグ（本人指定・2026-09-10）：外国人旅行者向けの選定がまだのため、
    // 実データ・クリック機能なしで置き場所だけ確保する
    var dummyCfg = TAG_CONFIG.meisha;
    var dummyTitle = currentLang === 'ja' ? '選定中（外国人旅行者向けに準備中）' : 'Coming soon (curation in progress)';
    var dummyHtml = '<button type="button" class="filter-btn-dummy" disabled title="' + dummyTitle + '">' +
      '<span class="dot" style="background:' + dummyCfg.border + ';box-shadow:0 0 5px ' + dummyCfg.border + '"></span>' +
      dummyCfg.label[currentLang] + '</button>';
    container.innerHTML = buttonsHtml + dummyHtml + '<div class="ctrl-divider"></div><div class="mock-stats" id="mock-stats"></div>';
  }
  renderFilterButtons();
  document.getElementById('mock-controls').addEventListener('click', function(e){
    var btn = e.target.closest('.filter-btn');
    if (!btn) return;
    var tag = btn.getAttribute('data-tag');
    activeFilters.has(tag) ? activeFilters.delete(tag) : activeFilters.add(tag);
    btn.classList.toggle('active', activeFilters.has(tag));
    redrawMarkers();
  });

  function updateStats() {
    var el = document.getElementById('mock-stats');
    if (!el) return;
    var n = markerList.filter(function(item){ return passesFilter(item.shrine); }).length;
    el.textContent = CHROME_TEXT[currentLang].shownFmt(n);
  }

  function buildShrineItem(shrine, dotColor) {
    var item = document.createElement('div');
    item.className = 'shrine-item';
    // サイドバー一覧の英語対応（本人指定・2026-09-10）：社名・都道府県名を
    // shrines-overseas.jsonのnameEn/prefEnに差し替える。祭神・由緒などの
    // 個別社データは従来どおり翻訳対象外（ポップアップは日本語のまま）
    var name = currentLang === 'en' ? shrine.nameEn : shrine.name;
    var pref = currentLang === 'en' ? shrine.prefEn : shrine.pref;
    item.innerHTML =
      '<div class="shrine-item-dot" style="background:' + dotColor + ';box-shadow:0 0 5px ' + dotColor + '80;"></div>' +
      '<div class="shrine-item-name">' + name + '</div>' +
      '<div class="shrine-item-pref">' + pref + '</div>';
    item.addEventListener('click', function(){ focusShrine(shrine); });
    return item;
  }

  function renderSidebarList() {
    var list = document.getElementById('sidebar-list');
    if (!list) return;
    list.innerHTML = '';
    var total = 0;
    TAG_ORDER.forEach(function(tag){
      if (!activeFilters.has(tag)) return;
      var items = markerList.filter(function(item){ return displayTag(item.shrine) === tag; });
      if (!items.length) return;
      var cfg = TAG_CONFIG[tag];
      var sec = document.createElement('div');
      sec.className = 'sidebar-section';
      var title = document.createElement('div');
      title.className = 'sidebar-section-title';
      title.style.cssText = 'background:' + cfg.bg + '; border-left:3px solid ' + cfg.border + '; color:' + cfg.border + ';';
      title.innerHTML = '<span>' + cfg.label[currentLang] + '</span><span class="sidebar-section-count">' + CHROME_TEXT[currentLang].countFmt(items.length) + '</span>';
      sec.appendChild(title);
      items.forEach(function(item){ sec.appendChild(buildShrineItem(item.shrine, cfg.color)); });
      list.appendChild(sec);
      total += items.length;
    });
    var countEl = document.getElementById('sidebar-count');
    if (countEl) countEl.textContent = CHROME_TEXT[currentLang].countFmt(total);
    var titleEl = document.getElementById('sidebar-title');
    if (titleEl) titleEl.textContent = CHROME_TEXT[currentLang].listTitle;
  }

  function focusShrine(shrine) {
    var entry = markerList.filter(function(item){ return item.shrine === shrine; })[0];
    if (!entry) return;
    if (!map.hasLayer(entry.marker)) entry.marker.addTo(map);
    map.flyTo([shrine.lat, shrine.lng], Math.max(map.getZoom(), 9), { duration: 0.7 });
    setTimeout(function(){ entry.marker.openPopup(); }, 650);
  }

  // マーカーの出現/消滅アニメーション再生。本番index.htmlの2026-09-09の修正
  // （animationendに頼らずsetTimeoutで確実にクラスを外す）をそのまま踏襲する
  function playMarkerAnim(icon, addClass, removeClass, totalMs) {
    icon.classList.remove(removeClass);
    icon.classList.add(addClass);
    setTimeout(function(){ icon.classList.remove(addClass); }, totalMs);
  }

  function redrawMarkers() {
    markerList.forEach(function(item){
      var show = passesFilter(item.shrine);
      var onMap = map.hasLayer(item.marker);
      if (show && item._removeTimer) {
        clearTimeout(item._removeTimer);
        item._removeTimer = null;
        var stayIcon = item.marker._icon;
        if (stayIcon) stayIcon.classList.remove('marker-pop-out');
        return;
      }
      if (show && !onMap) {
        item.marker.addTo(map);
        var inIcon = item.marker._icon;
        if (inIcon) playMarkerAnim(inIcon, 'marker-pop-in', 'marker-pop-out', 250);
      } else if (!show && onMap && !item._removeTimer) {
        var outIcon = item.marker._icon;
        if (outIcon) playMarkerAnim(outIcon, 'marker-pop-out', 'marker-pop-in', 150);
        item._removeTimer = setTimeout(function(){
          item._removeTimer = null;
          if (map.hasLayer(item.marker) && !passesFilter(item.shrine)) map.removeLayer(item.marker);
        }, 130);
      }
    });
    updateStats();
    renderSidebarList();
  }

  var markerList = [];
  var map; // fetch内で代入。redrawMarkers/focusShrineから参照するため外側スコープで宣言
  function applyLang(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
    document.getElementById('mock-title').textContent = HEADER_TITLE[lang];
    renderShrineDropdown();
    renderFilterButtons();
    updateStats();
    renderSidebarList();
    markerList.forEach(function(item){
      item.marker.setIcon(getIcon(topTag(item.shrine.tags)));
      if (item.marker.getPopup()) item.marker.getPopup().setContent(buildPopupContent(item.shrine));
    });
  }
  var langToggle = document.getElementById('lang-toggle');
  if (langToggle) {
    langToggle.addEventListener('click', function(e){
      var btn = e.target.closest('.lang-btn');
      if (btn) applyLang(btn.getAttribute('data-lang'));
    });
  }

  fetch('assets/shrines-overseas.json')
    .then(function(res){ return res.json(); })
    .then(function(shrines){
      // scrollWheelZoom:false で開始し、ページスクロールで地図の上を通過した
      // 最初の一撃だけ誤ズームを防ぐ。ただしその後は地図をスクロール操作で
      // 触りたいという本人要望があるため、地図上でのスクロールがいったん
      // 止まった時点（＝勢いで通過し終えたと判断できる時点）で自動的に
      // scrollWheelZoomを有効化する（本人指摘・2026-09-08）。
      map = L.map('shrine-map', { center: [36.0,136.5], zoom: 5, scrollWheelZoom: false });
      (function(){
        var mapEl = document.getElementById('shrine-map');
        var armTimer = null;
        function arm() {
          map.scrollWheelZoom.enable();
          mapEl.removeEventListener('wheel', onWheel);
        }
        function onWheel() {
          clearTimeout(armTimer);
          armTimer = setTimeout(arm, 500);
        }
        mapEl.addEventListener('wheel', onWheel, { passive: true });
      })();
      L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
        attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>',
        maxZoom: 18
      }).addTo(map);
      var bounds = [];
      shrines.forEach(function(s){
        var marker = L.marker([s.lat, s.lng], { icon: getIcon(topTag(s.tags)) })
          .bindPopup(buildPopupContent(s), { className: 'shrine-popup' });
        if (passesFilter(s)) marker.addTo(map);
        markerList.push({ marker: marker, shrine: s });
        bounds.push([s.lat, s.lng]);
      });
      updateStats();
      renderSidebarList();
      function fitWhenReady(attempts) {
        attempts = attempts || 0;
        map.invalidateSize();
        var size = map.getSize();
        if ((size.x > 0 && size.y > 0) || attempts >= 30) {
          map.fitBounds(bounds, { padding: [30,30] });
        } else {
          requestAnimationFrame(function(){ fitWhenReady(attempts + 1); });
        }
      }
      fitWhenReady();
    });
})();
</script>
</body>
</html>
